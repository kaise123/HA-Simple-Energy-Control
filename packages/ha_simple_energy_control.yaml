# ha_simple_energy_control.yaml
#
# HA Simple Energy Control — Home Assistant Package
# https://github.com/kaise123/HA-Simple-Energy-Control
#
# A native Home Assistant package that installs all helpers, template sensors,
# and automations for HA Simple Energy Control in a single file.
#
# INSTALLATION:
#   1. Enable packages in configuration.yaml (once only):
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file into your HA config "packages/" folder.
#   3. Update the USER CONFIGURATION section below for your environment.
#   4. Restart Home Assistant.
#   5. Configure the Lovelace dashboard (see dashboard.yaml).

# ===========================================================================
# USER CONFIGURATION
# Update the entity IDs and service names in this section to match your
# Home Assistant environment before copying this file to your packages/ folder.
# ===========================================================================
#
# -- AMBER ELECTRIC (Amber Express integration ≥ v2.0) ----------------------
# Install from HACS: https://github.com/hass-energy/amber-express
#
#   General (import) price sensor:
#     sensor.amber_express_home_general_price
#
#   Feed-in (export) price sensor:
#     sensor.amber_express_home_feed_in_price
#
#   These sensor names are determined by Amber Express using your site name.
#   If your Amber site is named differently the prefix will differ, e.g.:
#     sensor.amber_express_mysitename_general_price
#   Check Settings → Devices & Services → Amber Express to confirm.
#
# -- SOLCAST SOLAR (Solar Generation Forecasting) --------------------------
# Optional but recommended for Solar Soak pre-export logic.
# Install from HACS: https://github.com/BJReplay/ha-solcast-solar
#
#   Solcast forecast remaining today sensor:
#     sensor.solcast_pv_forecast_forecast_remaining_today
#
#   If your Solcast entity is named differently (e.g. sensor.solcast_pv_forecast_forecast_today),
#   update the sensor entity ID in the template sensor below.
#
# -- ALPHAESS BATTERY (Hillviewlodge Modbus integration) --------------------
# Docs: https://projects.hillviewlodge.ie/alphaess/
#
#   Battery state of charge:
#     sensor.alphaess_soc_battery
#
#   Dispatch mode selector (input_select):
#     input_select.alphaess_helper_dispatch_mode
#
#   Dispatch duration (minutes):
#     input_number.alphaess_helper_dispatch_duration
#
#   Dispatch trigger (input_boolean):
#     input_boolean.alphaess_helper_dispatch
#
#   Full reset button (returns inverter to normal mode):
#     input_button.alphaess_helper_dispatch_reset_full
#
# -- NOTIFICATIONS -----------------------------------------------------------
#   Mobile app notification service:
#     notify.mobile_app_phone
#
#   Replace "phone" with the name of your device as it appears under
#   Settings → Devices & Services → Mobile App.
#   Example: notify.mobile_app_johns_iphone
#
# ===========================================================================

utility_meter:
  amber_house_load_split:
    source: sensor.shelly_ct1_energy
    name: Amber House Load Split
    tariffs:
      - day
      - night

sensor:
  - platform: statistics
    name: "Amber 7-Day Daytime House Load"
    unique_id: amber_7_day_daytime_house_load
    entity_id: sensor.amber_house_load_split_day
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 20000

# ---------------------------------------------------------------------------
# TEMPLATE SENSORS
# Scans forecast arrays (Amber Express & Solcast) for price spikes, negative
# price windows, and expected solar yield to compute predictive dispatches.
# ---------------------------------------------------------------------------
template:
  - sensor:
      # Maximum expected feed-in (export) price over the next 1–12 hours.
      # A high value here triggers the predictive export hold, preserving
      # battery capacity for the upcoming price spike.
      - name: "Amber Max Export Forecast 12h"
        unique_id: amber_max_export_forecast_12h
        unit_of_measurement: "$/kWh"
        state_class: measurement
        icon: mdi:chart-line-variant
        state: >
          {% set fcast = state_attr('sensor.amber_express_home_feed_in_price', 'forecast') %}
          {% if fcast %}
            {% set start = now() + timedelta(hours=1) %}
            {% set end = now() + timedelta(hours=12) %}
            {% set ns = namespace(vals=[]) %}
            {% for item in fcast %}
              {% set item_dt = as_datetime(item.time) %}
              {% if item_dt is not none and item_dt > start and item_dt <= end %}
                {% set ns.vals = ns.vals + [item.value | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ ns.vals | max if ns.vals else 0 }}
          {% else %}
            0
          {% endif %}

      # Minimum expected general (import) price over the next 1–12 hours.
      # A low value here triggers the predictive import hold, waiting for
      # the upcoming cheap period before force-charging.
      - name: "Amber Min Import Forecast 12h"
        unique_id: amber_min_import_forecast_12h
        unit_of_measurement: "$/kWh"
        state_class: measurement
        icon: mdi:chart-line-variant
        state: >
          {% set fcast = state_attr('sensor.amber_express_home_general_price', 'forecast') %}
          {% if fcast %}
            {% set start = now() + timedelta(hours=1) %}
            {% set end = now() + timedelta(hours=12) %}
            {% set ns = namespace(vals=[]) %}
            {% for item in fcast %}
              {% set item_dt = as_datetime(item.time) %}
              {% if item_dt is not none and item_dt > start and item_dt <= end %}
                {% set ns.vals = ns.vals + [item.value | float(0)] %}
              {% endif %}
            {% endfor %}
            {{ ns.vals | min if ns.vals else 0 }}
          {% else %}
            0
          {% endif %}

      # Solcast conservative 10% solar forecast (kWh) for today.
      # Checks 'estimate10', 'pv_estimate10', or detailedForecast across Solcast entities.
      - name: "Amber Solcast 10 Forecast"
        unique_id: amber_solcast_10_forecast
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {% set candidates = [
            'sensor.solcast_pv_forecast_forecast_remaining_today',
            'sensor.solcast_pv_forecast_forecast_today',
            'sensor.solcast_forecast_remaining_today',
            'sensor.solcast_forecast_today'
          ] %}
          {% set ns = namespace(val=0, found=false) %}
          {% for s in candidates if not ns.found %}
            {% if states(s) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set e10 = state_attr(s, 'estimate10') %}
              {% set pve10 = state_attr(s, 'pv_estimate10') %}
              {% set detailed = state_attr(s, 'detailedForecast') %}
              {% if e10 is not none and e10 != '' %}
                {% set ns.val = e10 | float(0) | round(2) %}
                {% set ns.found = true %}
              {% elif pve10 is not none and pve10 != '' %}
                {% set ns.val = pve10 | float(0) | round(2) %}
                {% set ns.found = true %}
              {% elif detailed is iterable and detailed is not string and detailed is not mapping %}
                {% set total = namespace(t=0) %}
                {% for slot in detailed %}
                  {% set val = slot.pv_estimate10 if slot.pv_estimate10 is defined else (slot.pv_estimate if slot.pv_estimate is defined else 0) %}
                  {% set total.t = total.t + (val | float(0)) %}
                {% endfor %}
                {% set ns.val = total.t | round(2) %}
                {% set ns.found = true %}
              {% else %}
                {% set ns.val = states(s) | float(0) | round(2) %}
                {% set ns.found = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.val if ns.found else 0.0 }}

      # Historical 7-day average of daytime house load
      - name: "Amber Average Daytime House Load"
        unique_id: amber_average_daytime_house_load
        unit_of_measurement: "kWh"
        icon: mdi:home-lightning-bolt
        state: >
          {% set change = states('sensor.amber_7_day_daytime_house_load') | float(0) %}
          {{ (change / 7.0) | round(2) }}

      # Detects optimal discharge window for Solar Soak by finding the highest average
      # feed-in tariff block before a forecasted negative price drop.
      - name: "Amber Negative Export Forecast 12h"
        unique_id: amber_negative_export_forecast_12h
        icon: mdi:alert-circle-outline
        state: >
          {% set fcast = state_attr('sensor.amber_express_home_feed_in_price', 'forecast') %}
          {% set thresh = states('input_number.amber_curtailment_price_threshold') | float(0.00) %}
          {% set current_soc = states('sensor.alphaess_soc_battery') | float(0) %}
          {% set target_soc = states('sensor.amber_solar_soak_target_soc') | float(0) %}
          {% set batt_cap = states('input_number.amber_battery_capacity') | float(10.0) %}
          {% set inverter_power = states('input_number.amber_inverter_power') | float(5.0) %}
          
          {% set soc_to_discharge = current_soc - target_soc %}
          {% if soc_to_discharge > 0 and inverter_power > 0 and batt_cap > 0 %}
            {% set kwh_to_discharge = (soc_to_discharge / 100) * batt_cap %}
            {% set hours_needed = kwh_to_discharge / inverter_power %}
            {# Add a 30-minute buffer #}
            {% set hours_needed = hours_needed + 0.5 %}
          {% else %}
            {% set hours_needed = 0 %}
          {% endif %}

          {% if fcast and hours_needed > 0 %}
            {% set start_horizon = now() %}
            {% set end_horizon = now() + timedelta(hours=12) %}
            
            {# Find the first negative price (cutoff time) #}
            {% set ns = namespace(t_neg=none) %}
            {% for item in fcast %}
              {% set item_dt = as_datetime(item.time) %}
              {% if item_dt is not none and item_dt > start_horizon and item_dt <= end_horizon and ns.t_neg is none %}
                {% if item.value | float(0) <= thresh %}
                  {% set ns.t_neg = item_dt %}
                {% endif %}
              {% endif %}
            {% endfor %}

            {% if ns.t_neg is not none %}
              {% set time_until_neg = (ns.t_neg - now()).total_seconds() / 3600 %}
              {% if time_until_neg <= hours_needed %}
                {# Not enough time to fit the whole window, start immediately #}
                on
              {% else %}
                {# Find the most profitable discharge window #}
                {% set opt = namespace(best_avg=-999, best_start=now()) %}
                {% for start_item in fcast %}
                  {% set w_start = as_datetime(start_item.time) %}
                  {% if w_start is not none %}
                    {% set w_end = w_start + timedelta(hours=hours_needed) %}
                    {% if w_start >= (now() - timedelta(minutes=30)) and w_end <= ns.t_neg %}
                      {% set w_ns = namespace(sum=0, count=0) %}
                      {% for w_item in fcast %}
                        {% set w_item_dt = as_datetime(w_item.time) %}
                        {% if w_item_dt is not none and w_item_dt >= w_start and w_item_dt < w_end %}
                          {% set w_ns.sum = w_ns.sum + (w_item.value | float(0)) %}
                          {% set w_ns.count = w_ns.count + 1 %}
                        {% endif %}
                      {% endfor %}
                      {% if w_ns.count > 0 %}
                        {% set avg_price = w_ns.sum / w_ns.count %}
                        {% if avg_price > opt.best_avg %}
                          {% set opt.best_avg = avg_price %}
                          {% set opt.best_start = w_start %}
                        {% endif %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                
                {# Trigger if we are currently inside or past the optimal start time #}
                {% if now() >= opt.best_start %}
                  on
                {% else %}
                  off
                {% endif %}
              {% endif %}
            {% else %}
              off
            {% endif %}
          {% else %}
            off
          {% endif %}

  - trigger:
      # Freeze the target SOC calculation to early morning (midnight & 6AM) 
      # to prevent micro-adjustments as the Solcast forecast dances during the day.
      - platform: time
        at: "00:01:00"
      - platform: time
        at: "06:00:00"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_number.amber_soak_forecast_weight
          - input_number.amber_battery_capacity
          - input_number.amber_soak_max_target_soc
          - input_number.amber_soak_min_soc
    sensor:
      # Calculates the target battery SOC to pre-discharge down to before the negative price window.
      # Formula: Target SOC = Max Target SOC - (((Solcast 10% kWh * Weight) - Daytime House Load) / Battery Capacity kWh) * 100
      # Clamped between amber_soak_min_soc and amber_soak_max_target_soc.
      - name: "Amber Solar Soak Target SOC"
        unique_id: amber_solar_soak_target_soc
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-arrow-down
        state: >
          {% set solcast_kwh = states('sensor.amber_solcast_10_forecast') | float(0) %}
          {% set weight = states('input_number.amber_soak_forecast_weight') | float(1.0) %}
          {% set house_load = states('sensor.amber_average_daytime_house_load') | float(0) %}
          {% set batt_cap = states('input_number.amber_battery_capacity') | float(10.0) %}
          {% set max_target_soc = states('input_number.amber_soak_max_target_soc') | float(95) %}
          {% set min_soak_soc = states('input_number.amber_soak_min_soc') | float(20) %}
          {% if batt_cap > 0 %}
            {% set expected_solar_to_batt = (solcast_kwh * weight) - house_load %}
            {% set expected_solar_to_batt = expected_solar_to_batt if expected_solar_to_batt > 0 else 0 %}
            {% set required_headroom_pct = (expected_solar_to_batt / batt_cap) * 100.0 %}
            {% set calculated_target = max_target_soc - required_headroom_pct %}
            {% if calculated_target < min_soak_soc %}
              {{ min_soak_soc | round(0) | int(20) }}
            {% elif calculated_target > max_target_soc %}
              {{ max_target_soc | round(0) | int(95) }}
            {% else %}
              {{ calculated_target | round(0) | int(20) }}
            {% endif %}
          {% else %}
            {{ max_target_soc | round(0) | int(95) }}
          {% endif %}

# ---------------------------------------------------------------------------
# INPUT NUMBERS — Price, SOC & Solar Soak thresholds
# Configure these via the dashboard after installation.
# ---------------------------------------------------------------------------
input_number:

  # --- EXPORT TIERS (Selling to Grid) ------------------------------------
  # Tier 1: requires the highest SOC — activates at the most aggressive price
  amber_export_soc_1:
    name: Export Tier 1 Minimum SOC
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  amber_export_price_1:
    name: Export Tier 1 Minimum Price
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # Tier 2: mid SOC requirement, mid price threshold
  amber_export_soc_2:
    name: Export Tier 2 Minimum SOC
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  amber_export_price_2:
    name: Export Tier 2 Minimum Price
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # Tier 3: lowest SOC requirement, lowest price threshold
  amber_export_soc_3:
    name: Export Tier 3 Minimum SOC
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  amber_export_price_3:
    name: Export Tier 3 Minimum Price
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # --- IMPORT TIERS (Charging from Grid) ---------------------------------
  # Tier 1: triggers at the lowest SOC and cheapest import price
  amber_import_soc_1:
    name: Import Tier 1 Maximum SOC
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  amber_import_price_1:
    name: Import Tier 1 Maximum Price
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # Tier 2: mid SOC and slightly higher price ceiling
  amber_import_soc_2:
    name: Import Tier 2 Maximum SOC
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  amber_import_price_2:
    name: Import Tier 2 Maximum Price
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # --- HYSTERESIS --------------------------------------------------------
  # Adds a buffer around price thresholds to prevent rapid mode toggling
  # when live prices fluctuate near a configured threshold.
  amber_price_hysteresis:
    name: Price Hysteresis Buffer
    min: 0
    max: 1
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # SOC debounce: prevents rapid toggling when battery SOC sits near a tier threshold.
  # Active tiers only deactivate once SOC moves this many % beyond the threshold.
  amber_soc_hysteresis:
    name: SOC Hysteresis Buffer
    min: 0
    max: 20
    step: 1
    mode: box
    unit_of_measurement: "%"

  # --- PREDICTIVE THRESHOLDS --------------------------------------------
  # Export hold: blocks exporting when a forecasted future spike exceeds
  # this value, preserving battery capacity for the higher-value event.
  amber_export_forecast_threshold:
    name: Hold Exports if Future Spike Exceeds
    min: 0
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # Import hold: blocks force-charging when a future cheap period is
  # forecast below this value, waiting for the lower cost window instead.
  amber_import_forecast_threshold:
    name: Hold Imports if Future Drop is Below
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # --- ABSOLUTE OVERRIDES -----------------------------------------------
  # Releases a predictive export hold when the live price exceeds this
  # ceiling — ensuring extreme spot prices are never missed.
  amber_export_absolute_override:
    name: Release Export Hold if Live Price >
    min: 0
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # Releases a predictive import hold when the live price falls below this
  # floor — ensuring extreme negative prices are always captured.
  amber_import_absolute_override:
    name: Release Import Hold if Live Price <
    min: -5
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # --- EXPORT SOC GUARD -------------------------------------------------
  # Hard floor on battery SOC during export operations. Exporting is blocked
  # when SOC is at or below this level regardless of tier rules.
  # Adjust to protect battery warranty or minimum reserve requirements.
  amber_export_min_soc_guard:
    name: Export Minimum SOC Guard
    min: 0
    max: 50
    step: 1
    mode: box
    unit_of_measurement: "%"

  # --- SOLAR SOAK & CURTAILMENT -----------------------------------------
  # Total battery usable capacity in kWh
  amber_battery_capacity:
    name: Total Battery Capacity
    min: 1
    max: 100
    step: 0.1
    mode: box
    unit_of_measurement: "kWh"

  # Upper SOC ceiling to reach when soaking up solar during midday
  amber_soak_max_target_soc:
    name: Solar Soak Max Target SOC
    min: 50
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  # Dedicated minimum SOC floor for solar soak pre-exporting (independent of emergency SOC guard)
  amber_soak_min_soc:
    name: Solar Soak Minimum SOC Floor
    min: 0
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "%"

  # Multiplier to scale Solcast estimate (0.20 to 2.00) to tune aggressiveness
  amber_soak_forecast_weight:
    name: Solcast Forecast Weight Multiplier
    min: 0.20
    max: 2.00
    step: 0.05
    mode: box

  # Maximum inverter discharge power in kW (used to calculate soak duration)
  amber_inverter_power:
    name: Inverter Power Limit
    min: 1.0
    max: 20.0
    step: 0.1
    mode: box
    unit_of_measurement: "kW"

  # Minimum positive feed-in price required before discharging for solar soak
  amber_soak_min_pre_export_price:
    name: Min Feed-in Price to Pre-Export
    min: 0.00
    max: 1.00
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

  # Feed-in price below which solar export curtailment is triggered
  amber_curtailment_price_threshold:
    name: Curtailment Feed-in Price Threshold
    min: -2.00
    max: 0.50
    step: 0.01
    mode: box
    unit_of_measurement: "$/kWh"

# ---------------------------------------------------------------------------
# INPUT BOOLEANS — Feature toggles
# ---------------------------------------------------------------------------
input_boolean:

  # Master on/off — disabling returns the inverter to standard self-consumption
  amber_automation_enabled:
    name: Master Automation Switch
    icon: mdi:power

  # Per-tier export enables
  amber_export_tier_1_enabled:
    name: Enable Export Tier 1
    icon: mdi:numeric-1-circle
  amber_export_tier_2_enabled:
    name: Enable Export Tier 2
    icon: mdi:numeric-2-circle
  amber_export_tier_3_enabled:
    name: Enable Export Tier 3
    icon: mdi:numeric-3-circle

  # Per-tier import enables
  amber_import_tier_1_enabled:
    name: Enable Import Tier 1
    icon: mdi:numeric-1-circle
  amber_import_tier_2_enabled:
    name: Enable Import Tier 2
    icon: mdi:numeric-2-circle

  # Predictive hold toggles — suspend normal tier rules when a future
  # price event is anticipated in the 12-hour Amber Express forecast
  amber_predictive_export_hold:
    name: Enable Predictive Export Hold
    icon: mdi:history
  amber_predictive_import_hold:
    name: Enable Predictive Import Hold
    icon: mdi:history

  # Solar Soak & Curtailment toggles
  amber_solar_soak_enabled:
    name: Enable Predictive Solar Soaking
    icon: mdi:solar-power-variant
  amber_curtailment_enabled:
    name: Enable Negative Price Curtailment
    icon: mdi:shield-sun
  amber_solar_soak_completed_today:
    name: Solar Soak Completed Today
    icon: mdi:check-circle

# ---------------------------------------------------------------------------
# INPUT TEXT — Status display
# ---------------------------------------------------------------------------
input_text:
  # Displays the currently active automation state on the dashboard.
  # Updated on every automation run; used to suppress duplicate notifications.
  amber_active_tier_status:
    name: Current Automation Status
    initial: "🟢 Idle (Normal Mode)"

# ---------------------------------------------------------------------------
# AUTOMATION
# ---------------------------------------------------------------------------
automation:
  - id: amber_solar_soak_reset
    alias: "Amber Solar Soak Reset Daily"
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.amber_solar_soak_completed_today

  - id: amber_house_load_tariff_switch
    alias: "Amber House Load Tariff Switch"
    trigger:
      - platform: sun
        event: sunrise
        id: 'day'
      - platform: sun
        event: sunset
        id: 'night'
    action:
      - service: select.select_option
        target:
          entity_id: select.amber_house_load_split
        data:
          option: "{{ trigger.id }}"

  - id: 'alphaess_amber_optimization_tiered'
    alias: "HA Simple Energy Control: AlphaESS Amber Dispatch"
    description: >
      Maximise Amber Electric profits with multi-tier SOC rules, predictive
      12-hour holds, predictive solar soaking, and negative price curtailment.
      Uses Amber Express (≥ v2.0) and Solcast for pricing and solar forecasting.
      Activates Mode 4 for export and solar soak pre-discharging; activates
      Mode 6 for full-power grid force-charging; and returns to Mode 5 for
      self-consumption / curtailment. Runs on price, SOC, or forecast changes.
    mode: restart

    trigger:
      # Price, SOC, and Forecast changes — react to real updates only; ignore unavailable/unknown
      # (e.g. on HA startup or sensor outage) to prevent spurious dispatch commands.
      - platform: state
        entity_id:
          - sensor.amber_express_home_general_price   # ← update if your site name differs
          - sensor.amber_express_home_feed_in_price   # ← update if your site name differs
          - sensor.alphaess_soc_battery
          - sensor.amber_solar_soak_target_soc
          - sensor.amber_negative_export_forecast_12h
          - sensor.alphaess_battery_full
        not_to:
          - "unknown"
          - "unavailable"

      # Feature toggles — react to any change (on/off has no unavailable state)
      - platform: state
        entity_id:
          - input_boolean.amber_automation_enabled
          - input_boolean.amber_export_tier_1_enabled
          - input_boolean.amber_export_tier_2_enabled
          - input_boolean.amber_export_tier_3_enabled
          - input_boolean.amber_import_tier_1_enabled
          - input_boolean.amber_import_tier_2_enabled
          - input_boolean.amber_predictive_export_hold
          - input_boolean.amber_predictive_import_hold
          - input_boolean.amber_solar_soak_enabled
          - input_boolean.amber_curtailment_enabled

      # Threshold changes — re-evaluate immediately when any rule is adjusted from the dashboard
      - platform: state
        entity_id:
          - input_number.amber_export_soc_1
          - input_number.amber_export_price_1
          - input_number.amber_export_soc_2
          - input_number.amber_export_price_2
          - input_number.amber_export_soc_3
          - input_number.amber_export_price_3
          - input_number.amber_import_soc_1
          - input_number.amber_import_price_1
          - input_number.amber_import_soc_2
          - input_number.amber_import_price_2
          - input_number.amber_price_hysteresis
          - input_number.amber_soc_hysteresis
          - input_number.amber_export_forecast_threshold
          - input_number.amber_import_forecast_threshold
          - input_number.amber_export_absolute_override
          - input_number.amber_import_absolute_override
          - input_number.amber_export_min_soc_guard
          - input_number.amber_battery_capacity
          - input_number.amber_soak_max_target_soc
          - input_number.amber_soak_min_soc
          - input_number.amber_soak_forecast_weight
          - input_number.amber_soak_min_pre_export_price
          - input_number.amber_curtailment_price_threshold

      # Periodic safety check & keep-alive refresh — fires every 15 min.
      # Ensures continuous dispatches are kept alive before the 60-min timer expires.
      - platform: time_pattern
        minutes: "/15"

      # Immediate re-arm if the integration turns off dispatch while an export/import tier is active
      - platform: state
        entity_id: input_boolean.alphaess_helper_dispatch
        to: "off"

      # Pre-emptive re-arm: Trigger when the dispatch timer has less than 5 minutes remaining
      - platform: template
        value_template: >
          {{ states('timer.alphaess_helper_dispatch_timer') == 'active' and
             state_attr('timer.alphaess_helper_dispatch_timer', 'finishes_at') is not none and
             (as_timestamp(state_attr('timer.alphaess_helper_dispatch_timer', 'finishes_at')) - as_timestamp(now())) < 300 }}

    action:
      - variables:
          # 1. Fetch current states
          soc: "{{ states('sensor.alphaess_soc_battery') | float(0) }}"
          import_price: "{{ states('sensor.amber_express_home_general_price') | float(0) }}"
          export_price: "{{ states('sensor.amber_express_home_feed_in_price') | float(0) }}"
          hysteresis: "{{ states('input_number.amber_price_hysteresis') | float(0) }}"
          soc_hysteresis: "{{ states('input_number.amber_soc_hysteresis') | float(0) }}"
          enabled: "{{ is_state('input_boolean.amber_automation_enabled', 'on') }}"
          current_status: "{{ states('input_text.amber_active_tier_status') }}"

          # 2. Detect which tier/state is currently active (used for asymmetric hysteresis).
          currently_exporting_t1: "{{ 'Exporting (Tier 1)' in current_status }}"
          currently_exporting_t2: "{{ 'Exporting (Tier 2)' in current_status }}"
          currently_exporting_t3: "{{ 'Exporting (Tier 3)' in current_status }}"
          currently_importing_t1: "{{ 'Importing (Tier 1)' in current_status }}"
          currently_importing_t2: "{{ 'Importing (Tier 2)' in current_status }}"
          currently_soaking: "{{ 'Solar Soak' in current_status }}"
          currently_curtailed: "{{ 'Solar Curtailed' in current_status }}"

          # 3. Negative Price Curtailment Check
          # Active when curtailment toggle is ON, battery is full, and live feed-in price is at or below threshold (with hysteresis)
          curtailment_active: >
            {{ is_state('input_boolean.amber_curtailment_enabled', 'on')
               and is_state('sensor.alphaess_battery_full', 'true')
               and (
                 (currently_curtailed
                  and export_price <= (states('input_number.amber_curtailment_price_threshold')|float(0.00) + hysteresis))
                 or
                 (not currently_curtailed
                  and export_price <= states('input_number.amber_curtailment_price_threshold')|float(0.00))
               ) }}

          # 4. Predictive Hold Logic (with absolute overrides)
          pred_exp_active: >
            {{ is_state('input_boolean.amber_predictive_export_hold', 'on')
               and states('sensor.amber_max_export_forecast_12h')|float(0) >= states('input_number.amber_export_forecast_threshold')|float(99)
               and export_price < states('input_number.amber_export_absolute_override')|float(99) }}

          pred_imp_active: >
            {{ is_state('input_boolean.amber_predictive_import_hold', 'on')
               and states('sensor.amber_min_import_forecast_12h')|float(0) <= states('input_number.amber_import_forecast_threshold')|float(-99)
               and import_price > states('input_number.amber_import_absolute_override')|float(-99) }}

          # 5. Solar Soak Pre-Export Logic
          soak_target_soc: "{{ states('sensor.amber_solar_soak_target_soc') | float(20) }}"
          soak_min_soc: "{{ states('input_number.amber_soak_min_soc') | float(20) }}"
          soak_exp_active: >
            {{ enabled and not curtailment_active and not pred_exp_active
               and is_state('input_boolean.amber_solar_soak_enabled', 'on')
               and is_state('sensor.amber_negative_export_forecast_12h', 'on')
               and is_state('input_boolean.amber_solar_soak_completed_today', 'off')
               and export_price >= states('input_number.amber_soak_min_pre_export_price')|float(0.05)
               and (
                 (currently_soaking
                  and soc > (soak_target_soc - soc_hysteresis)
                  and soc > soak_min_soc)
                 or
                 (not currently_soaking
                  and soc > soak_target_soc
                  and soc > soak_min_soc)
               ) }}

          # 6. Evaluate export and import tier rules (blocked if curtailment is active)
          t1_exp: >
            {{ enabled and not curtailment_active and not pred_exp_active
               and is_state('input_boolean.amber_export_tier_1_enabled', 'on')
               and (
                 (currently_exporting_t1
                  and soc >= (states('input_number.amber_export_soc_1')|float(100) - soc_hysteresis)
                  and export_price >= (states('input_number.amber_export_price_1')|float(99) - hysteresis))
                 or
                 (not currently_exporting_t1
                  and soc >= states('input_number.amber_export_soc_1')|float(100)
                  and export_price >= states('input_number.amber_export_price_1')|float(99))
               ) }}

          t2_exp: >
            {{ enabled and not curtailment_active and not pred_exp_active
               and is_state('input_boolean.amber_export_tier_2_enabled', 'on')
               and (
                 (currently_exporting_t2
                  and soc >= (states('input_number.amber_export_soc_2')|float(100) - soc_hysteresis)
                  and export_price >= (states('input_number.amber_export_price_2')|float(99) - hysteresis))
                 or
                 (not currently_exporting_t2
                  and soc >= states('input_number.amber_export_soc_2')|float(100)
                  and export_price >= states('input_number.amber_export_price_2')|float(99))
               ) }}

          t3_exp: >
            {{ enabled and not curtailment_active and not pred_exp_active
               and is_state('input_boolean.amber_export_tier_3_enabled', 'on')
               and (
                 (currently_exporting_t3
                  and soc >= (states('input_number.amber_export_soc_3')|float(100) - soc_hysteresis)
                  and export_price >= (states('input_number.amber_export_price_3')|float(99) - hysteresis))
                 or
                 (not currently_exporting_t3
                  and soc >= states('input_number.amber_export_soc_3')|float(100)
                  and export_price >= states('input_number.amber_export_price_3')|float(99))
               ) }}

          t1_imp: >
            {{ enabled and not pred_imp_active
               and is_state('input_boolean.amber_import_tier_1_enabled', 'on')
               and (
                 (currently_importing_t1
                  and soc <= (states('input_number.amber_import_soc_1')|float(0) + soc_hysteresis)
                  and import_price <= (states('input_number.amber_import_price_1')|float(-99) + hysteresis))
                 or
                 (not currently_importing_t1
                  and soc <= states('input_number.amber_import_soc_1')|float(0)
                  and import_price <= states('input_number.amber_import_price_1')|float(-99))
               ) }}

          t2_imp: >
            {{ enabled and not pred_imp_active
               and is_state('input_boolean.amber_import_tier_2_enabled', 'on')
               and (
                 (currently_importing_t2
                  and soc <= (states('input_number.amber_import_soc_2')|float(0) + soc_hysteresis)
                  and import_price <= (states('input_number.amber_import_price_2')|float(-99) + hysteresis))
                 or
                 (not currently_importing_t2
                  and soc <= states('input_number.amber_import_soc_2')|float(0)
                  and import_price <= states('input_number.amber_import_price_2')|float(-99))
               ) }}

          # 7. Determine the single active action (in priority order).
          active_action: >
            {%- if not enabled -%} disabled
            {%- elif curtailment_active -%} curtailed
            {%- elif pred_exp_active -%} holding_export
            {%- elif pred_imp_active -%} holding_import
            {%- elif soak_exp_active -%} solar_soak
            {%- elif (t1_exp or t2_exp or t3_exp) and soc <= states('input_number.amber_export_min_soc_guard') | float(10) -%} holding_soc_guard
            {%- elif t1_exp -%} export_1
            {%- elif t2_exp -%} export_2
            {%- elif t3_exp -%} export_3
            {%- elif t1_imp -%} import_1
            {%- elif t2_imp -%} import_2
            {%- else -%} idle {%- endif -%}

          # 8. Human-readable status string — driven entirely from active_action.
          # We use purely static strings here to prevent spamming notifications 
          # or Modbus writes when dynamic variables (like live price) fluctuate.
          new_status_text: >
            {%- if active_action == 'disabled' -%} 🔴 Automation Disabled
            {%- elif active_action == 'curtailed' -%} 🛑 Solar Curtailed
            {%- elif active_action == 'holding_export' -%} 🛑 Holding Exports (Spike Forecasted!)
            {%- elif active_action == 'holding_import' -%} 🛑 Holding Imports (Drop Forecasted!)
            {%- elif active_action == 'solar_soak' -%} ☀️ Solar Soak Pre-Export Active
            {%- elif active_action == 'holding_soc_guard' -%} 🛑 Export Blocked (SOC Guard Active)
            {%- elif active_action == 'export_1' -%} 📤 Exporting (Tier 1)
            {%- elif active_action == 'export_2' -%} 📤 Exporting (Tier 2)
            {%- elif active_action == 'export_3' -%} 📤 Exporting (Tier 3)
            {%- elif active_action == 'import_1' -%} 📥 Importing (Tier 1)
            {%- elif active_action == 'import_2' -%} 📥 Importing (Tier 2)
            {%- else -%} 🟢 Idle (Normal Mode) {%- endif -%}

      # Early exit when already disabled: prevents the automation from interfering with manual
      # dispatch modes while the master switch is off. On the FIRST trigger after disabling,
      # current_status still holds the previous state so the one-time inverter reset fires.
      - condition: template
        value_template: "{{ enabled or 'Automation Disabled' not in current_status }}"

      - choose:
          # --- EXPORT / SOLAR SOAK TRIGGER ---
          # Activates Maximise Output (Mode 4) for up to 60 minutes when an export
          # tier or solar soak pre-export condition is met and battery has charge to give.
          # Dispatch commands are rate-limited: sent on state change, hardware timeout,
          # or via a 45-minute keep-alive refresh to prevent unnecessary Modbus writes.
          - conditions:
              - condition: template
                value_template: "{{ active_action in ['export_1', 'export_2', 'export_3', 'solar_soak'] }}"
              - condition: template
                value_template: >
                  {{ (active_action == 'solar_soak' and soc > soak_min_soc) or
                     (active_action in ['export_1', 'export_2', 'export_3'] and soc > states('input_number.amber_export_min_soc_guard') | float(10)) }}
            sequence:
              # Modbus dispatch write (only on state change, timeout, or 45-min keep-alive refresh)
              - if:
                  - condition: template
                    value_template: >
                      {{ current_status != new_status_text
                         or is_state('input_boolean.alphaess_helper_dispatch', 'off')
                         or not is_state('input_select.alphaess_helper_dispatch_mode', 'Maximise Output (4)')
                         or (as_timestamp(now()) - (states.input_boolean.alphaess_helper_dispatch.last_changed | as_timestamp(0))) > 2700 }}
                then:
                  - service: input_select.select_option
                    target:
                      entity_id: input_select.alphaess_helper_dispatch_mode
                    data:
                      option: "Maximise Output (4)"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.alphaess_helper_dispatch_duration
                    data:
                      value: >
                        {% if states('input_number.alphaess_helper_dispatch_duration') | float(0) == 60 %}
                          59
                        {% else %}
                          60
                        {% endif %}
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.alphaess_helper_dispatch

          # --- IMPORT TRIGGER ---
          # Activates Optimise Consumption (Mode 6) for up to 60 minutes when an import
          # tier condition is met and the battery is not already full.
          # Mode 6: force-charges the battery at full power from the grid;
          # house load served by grid; PV output also contributes.
          # Dispatch commands are rate-limited: sent on state change, hardware timeout,
          # or via a 45-minute keep-alive refresh to prevent unnecessary Modbus writes.
          - conditions:
              - condition: template
                value_template: "{{ active_action in ['import_1', 'import_2'] }}"
              - condition: template
                value_template: "{{ soc < 98 }}"
            sequence:
              # Modbus dispatch write (only on state change, timeout, or 45-min keep-alive refresh)
              - if:
                  - condition: template
                    value_template: >
                      {{ current_status != new_status_text
                         or is_state('input_boolean.alphaess_helper_dispatch', 'off')
                         or not is_state('input_select.alphaess_helper_dispatch_mode', 'Optimise Consumption (6)')
                         or (as_timestamp(now()) - (states.input_boolean.alphaess_helper_dispatch.last_changed | as_timestamp(0))) > 2700 }}
                then:
                  - service: input_select.select_option
                    target:
                      entity_id: input_select.alphaess_helper_dispatch_mode
                    data:
                      option: "Optimise Consumption (6)"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.alphaess_helper_dispatch_duration
                    data:
                      value: >
                        {% if states('input_number.alphaess_helper_dispatch_duration') | float(0) == 60 %}
                          59
                        {% else %}
                          60
                        {% endif %}
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.alphaess_helper_dispatch

        # --- IDLE / DISABLED / HOLDING / CURTAILED (RETURN TO NORMAL) ---
        # Resets the inverter to standard self-consumption via the reset button.
        # Only fires when leaving an active export, import, or solar soak session —
        # prevents spurious Modbus writes when disabling from idle, or when a
        # predictive hold activates while the inverter is already in normal mode.
        default:
          - if:
              - condition: template
                value_template: >
                  {{ current_status != new_status_text and
                     ('Exporting' in current_status or 'Importing' in current_status or 'Solar Soak' in current_status) }}
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.alphaess_helper_dispatch
              - service: input_button.press
                target:
                  entity_id: input_button.alphaess_helper_dispatch_reset_full
              - if:
                  - condition: template
                    value_template: "{{ 'Solar Soak' in current_status }}"
                then:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.amber_solar_soak_completed_today

      # --- 9. UPDATE STATE MACHINE ---
      # Update dashboard status indicator. This MUST happen AFTER the physical Modbus commands 
      # above to prevent 'mode: restart' race conditions from swallowing hardware writes.
      - service: input_text.set_value
        target:
          entity_id: input_text.amber_active_tier_status
        data:
          value: "{{ new_status_text }}"

      # --- 10. UNIFIED NOTIFICATION MANAGER ---
      # Fires a context-aware push notification exactly once on every state transition.
      - if:
          - condition: template
            value_template: "{{ current_status != new_status_text }}"
        then:
          - service: notify.mobile_app_phone   # ← update to your device
            data:
              title: >
                {% if active_action == 'solar_soak' %}☀️ Solar Soak Pre-Export Active
                {% elif active_action == 'curtailed' %}🛑 Solar Export Curtailed
                {% elif active_action == 'idle' %}🔄 HA Simple Energy Control Reset
                {% elif 'export' in active_action %}📈 Amber Export Initiated!
                {% elif 'import' in active_action %}📉 Amber Import Initiated!
                {% elif 'holding' in active_action %}🛑 Predictive Hold Active
                {% elif active_action == 'disabled' %}🔴 Automation Disabled
                {% else %}⚡ System State Changed{% endif %}
              message: >
                {% if active_action == 'solar_soak' %}
                  Pre-exporting battery from {{ soc | int(0) }}% down to {{ soak_target_soc | int(20) }}% Target SoC to absorb upcoming midday solar. Feed-in: ${{ export_price }}/kWh.
                {% elif active_action == 'idle' %}
                  Prices have normalised. Returning to standard self-consumption.
                {% elif active_action == 'curtailed' %}
                  Feed-in price is ${{ export_price }}/kWh. Halting exports to protect against negative tariffs.
                {% elif active_action == 'disabled' %}
                  The master switch has been turned off. Returning to manual control.
                {% elif 'export' in active_action %}
                  {{ new_status_text }} - Feed-in is ${{ export_price }}/kWh (SOC: {{ soc }}%).
                {% elif 'import' in active_action %}
                  {{ new_status_text }} - Import is ${{ import_price }}/kWh (SOC: {{ soc }}%).
                {% else %}
                  {{ new_status_text }} (Feed-in: ${{ export_price }}/kWh, Import: ${{ import_price }}/kWh, SOC: {{ soc }}%).
                {% endif %}
