title: Energy Management
views:
  - title: Import/Export Automation Control
    icon: mdi:solar-power
    cards:
      # --- SYSTEM STATUS & MASTER SWITCH ---
      - type: entities
        title: System Status
        entities:
          - entity: input_boolean.amber_automation_enabled
            name: Master Automation Switch
          - entity: input_text.amber_active_tier_status
            name: Current System Status
            icon: mdi:information-outline

      # --- VISUAL GRAPHS ---
      - type: custom:power-flow-card-plus
        title: Live Power Flow
        entities:
          home:
            entity: sensor.shelly_ct1_power
          battery:
            entity: sensor.alphaess_power_battery
            state_of_charge: sensor.alphaess_soc_battery
            invert_state: true 
          grid:
            entity: sensor.alphaess_power_grid
            invert_state: false 
          solar:
            entity: sensor.alphaess_current_pv_production
            display_zero_state: true
        clickable_entities: true
        display_zero_lines: true
        use_new_flow_rate_model: true
        w_decimals: 0
        kw_decimals: 2
        
      - type: custom:apexcharts-card
        header:
          show: true
          title: Amber Price Trends
          show_states: true
          colorize_states: true
        graph_span: 24h
        span:
          start: day
        now:
          show: true
          label: Now
          color: red
        series:
          - entity: sensor.amber_express_home_general_price
            name: Import Price
            type: line
            curve: smooth
            color: '#e74c3c'
            extend_to: now
          - entity: sensor.amber_express_home_feed_in_price
            name: Feed-in Price
            type: area
            curve: smooth
            color: '#2ecc71'
            opacity: 0.3
            extend_to: now

      # --- EXPORT RULES (DYNAMIC) ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### 📤 Export Tiers (Selling to Grid)
              
              These rules dictate when the system will automatically dump power to the grid. The highest battery tier matched takes priority.
              
              **Your Current Active Rules:**
              
              {% if is_state('input_boolean.amber_export_tier_1_enabled', 'on') %}✅{% else %}❌{% endif %} **Tier 1:** When battery is over **{{ states('input_number.amber_export_soc_1') }}%**, export if feed-in is above **${{ states('input_number.amber_export_price_1') }}**.
              
              {% if is_state('input_boolean.amber_export_tier_2_enabled', 'on') %}✅{% else %}❌{% endif %} **Tier 2:** When battery is over **{{ states('input_number.amber_export_soc_2') }}%**, export if feed-in is above **${{ states('input_number.amber_export_price_2') }}**.
              
              {% if is_state('input_boolean.amber_export_tier_3_enabled', 'on') %}✅{% else %}❌{% endif %} **Tier 3:** When battery is over **{{ states('input_number.amber_export_soc_3') }}%**, export if feed-in is above **${{ states('input_number.amber_export_price_3') }}**.
          - type: entities
            entities:
              - type: section
                label: Tier 1 (Highest SOC)
              - entity: input_boolean.amber_export_tier_1_enabled
              - entity: input_number.amber_export_soc_1
                name: "If SOC % is greater than:"
              - entity: input_number.amber_export_price_1
                name: "Export if price ($) is above:"
              - type: section
                label: Tier 2 (Mid SOC)
              - entity: input_boolean.amber_export_tier_2_enabled
              - entity: input_number.amber_export_soc_2
                name: "If SOC % is greater than:"
              - entity: input_number.amber_export_price_2
                name: "Export if price ($) is above:"
              - type: section
                label: Tier 3 (Low SOC)
              - entity: input_boolean.amber_export_tier_3_enabled
              - entity: input_number.amber_export_soc_3
                name: "If SOC % is greater than:"
              - entity: input_number.amber_export_price_3
                name: "Export if price ($) is above:"

      # --- IMPORT RULES (DYNAMIC) ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### 📥 Import Tiers (Charging from Grid)
              
              These rules dictate when the system will automatically charge from the grid, which is ideal for capturing negative prices.
              
              **Your Current Active Rules:**
              
              {% if is_state('input_boolean.amber_import_tier_1_enabled', 'on') %}✅{% else %}❌{% endif %} **Tier 1:** When battery is below **{{ states('input_number.amber_import_soc_1') }}%**, force-charge if import price is below **${{ states('input_number.amber_import_price_1') }}**.
              
              {% if is_state('input_boolean.amber_import_tier_2_enabled', 'on') %}✅{% else %}❌{% endif %} **Tier 2:** When battery is below **{{ states('input_number.amber_import_soc_2') }}%**, force-charge if import price is below **${{ states('input_number.amber_import_price_2') }}**.
          - type: entities
            entities:
              - type: section
                label: Tier 1 (Lowest SOC)
              - entity: input_boolean.amber_import_tier_1_enabled
              - entity: input_number.amber_import_soc_1
                name: "If SOC % is less than:"
              - entity: input_number.amber_import_price_1
                name: "Charge if price ($) is below:"
              - type: section
                label: Tier 2 (Mid SOC)
              - entity: input_boolean.amber_import_tier_2_enabled
              - entity: input_number.amber_import_soc_2
                name: "If SOC % is less than:"
              - entity: input_number.amber_import_price_2
                name: "Charge if price ($) is below:"

# --- PREDICTIVE LOGIC & FORECASTING ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### 🔮 Predictive Battery Hold
              
              These overrides pause your Export or Import tiers if a massive price event is forecasted **between 1 and 12 hours from now** (ignoring the current hour).
              
              **Absolute Release:** If the live price crosses your Absolute Release threshold, the hold is instantly destroyed and your normal tiers engage.
              
              {% if is_state('input_boolean.amber_predictive_export_hold', 'on') and states('sensor.amber_max_export_forecast_12h')|float(0) >= states('input_number.amber_export_forecast_threshold')|float(0) and states('sensor.amber_express_home_feed_in_price')|float(0) < states('input_number.amber_export_absolute_override')|float(99) %}
              🛑 **EXPORT BLOCKED:** A future spike of **${{ states('sensor.amber_max_export_forecast_12h') }}** is coming! Exports are paused unless the live price hits **${{ states('input_number.amber_export_absolute_override') }}**.
              {% elif is_state('input_boolean.amber_predictive_import_hold', 'on') and states('sensor.amber_min_import_forecast_12h')|float(0) <= states('input_number.amber_import_forecast_threshold')|float(0) and states('sensor.amber_express_home_general_price')|float(0) > states('input_number.amber_import_absolute_override')|float(-99) %}
              🛑 **IMPORT BLOCKED:** A future drop to **${{ states('sensor.amber_min_import_forecast_12h') }}** is coming! Charging is paused unless the live price hits **${{ states('input_number.amber_import_absolute_override') }}**.
              {% else %}
              🟢 **No holds active.** Future forecasts are normal, or an Absolute Release was triggered.
              {% endif %}
          - type: entities
            entities:
              - type: section
                label: "Future Forecast Data (1h to 12h)"
              - entity: sensor.amber_max_export_forecast_12h
                name: Highest Future Export Price
              - entity: sensor.amber_min_import_forecast_12h
                name: Lowest Future Import Price
              - type: section
                label: Predictive Export Override
              - entity: input_boolean.amber_predictive_export_hold
              - entity: input_number.amber_export_forecast_threshold
                name: Hold if Future Spike >
              - entity: input_number.amber_export_absolute_override
                name: Release Hold if Live Price >
              - type: section
                label: Predictive Import Override
              - entity: input_boolean.amber_predictive_import_hold
              - entity: input_number.amber_import_forecast_threshold
                name: Hold if Future Drop <
              - entity: input_number.amber_import_absolute_override
                name: Release Hold if Live Price <


      # --- MANUAL CONTROLS & MODBUS EXPLANATIONS ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### 🛠️ Modbus Manual Controls
              
              Use these controls to manually override the automation. Below is a guide to what each dispatch mode actually does to your AlphaESS system:
              <br><br>
              **1 - Battery only Charges from PV**<br>
              Battery charges from PV at the set power. Battery will not discharge/feed house loads. Excess PV is sent to the grid.
              <br>
              **2 - State of Charge Control**<br>
              Holds the battery at a set SOC level — charges or discharges as needed to maintain the target.
              <br>
              **3 - Load Following**<br>
              Battery discharges to match house load exactly, preventing accidental export.
              <br>
              **4 - Maximise Output**<br>
              Forces the battery to discharge at maximum capacity to the grid. *(Used by automation for price spikes).*
              <br>
              **5 - Normal Mode**<br>
              Default behavior. Solar charges battery first, then covers house load, then exports excess.
              <br>
              **6 - Optimise Consumption**<br>
              Force-charges the battery at full inverter power from the grid. PV also contributes when available. *(Used by automation for cheap imports.)*
              <br>
              **7 - Maximise Consumption**<br>
              Force charge the battery at full power using only the grid. PV input is disabled.
              <br>
              **19 - No Battery Charge**<br>
              Completely prevents the battery from charging.
          - type: entities
            entities:
              - entity: input_select.alphaess_helper_dispatch_mode
                name: Current Dispatch Mode
              - entity: input_number.alphaess_helper_dispatch_duration
                name: Dispatch Duration (minutes)
              - entity: input_boolean.alphaess_helper_dispatch
                name: Force Dispatch Active
              - entity: input_button.alphaess_helper_dispatch_reset_full
                name: Reset to Normal Mode

  - title: Advanced Tuning
    icon: mdi:tune-variant
    cards:
      # --- HYSTERESIS & SOC DEBOUNCE ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### ↕️ Logic Tuning (Hysteresis)

              Hysteresis prevents the system from rapidly toggling when prices or battery SOC hover near your configured thresholds.


              **How it works:**


              - **Entry (no buffer):** A tier activates the moment a threshold is crossed — there is no delay or buffer on the way in.

              - **Exit (buffered):** Once a tier is active, it only deactivates once the price or SOC has moved *beyond* the threshold by the hysteresis amount. Small fluctuations back below the line are ignored.


              ---


              **Price Hysteresis (${{ states('input_number.amber_price_hysteresis') }}/kWh):** Once a price tier is active, the price must fall this far *below* the trigger price before the tier deactivates.


              **SOC Hysteresis ({{ states('input_number.amber_soc_hysteresis') }}%):** Once a SOC tier is active, the battery SOC must move this far *beyond* the SOC threshold before the tier deactivates. This prevents rapid export on/off switching when solar output keeps the battery hovering right at the threshold.


              **Export Minimum SOC Guard ({{ states('input_number.amber_export_min_soc_guard') }}%):** Exports are blocked entirely when battery SOC is at or below this level, regardless of tier rules. Increase to protect battery warranty or reserve capacity for evening use.
          - type: entities
            entities:
              - type: section
                label: Price Hysteresis
              - entity: input_number.amber_price_hysteresis
                name: Price Hysteresis Buffer ($/kWh)
              - type: section
                label: SOC Hysteresis (Debounce)
              - entity: input_number.amber_soc_hysteresis
                name: SOC Hysteresis Buffer (%)
              - type: section
                label: Export SOC Guard
              - entity: input_number.amber_export_min_soc_guard
                name: Export Minimum SOC Guard (%)
