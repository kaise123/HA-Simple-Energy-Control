title: HA Simple Energy Control - Diagnostics & Simulator
views:
  # =========================================================================
  # VIEW 1: ENGINE DIAGNOSTICS
  # Everything here is read from sensor.amber_engine_decision, which the engine
  # publishes on every run. Nothing re-implements the decision logic, so this
  # view always shows what the engine actually decided and why.
  # =========================================================================
  - title: Engine Diagnostics
    path: engine
    icon: mdi:bug-outline
    type: sections
    max_columns: 3
    sections:
      # --- DECISION, HEALTH CHECKS & RULE WALK-THROUGH ---
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Engine Decision
            icon: mdi:state-machine
            badges:
              - type: entity
                entity: sensor.amber_engine_decision
                show_state: true
                state_content: last_updated

          # Current decision, why, and whether reality matches it
          - type: markdown
            # Full width: this section spans two columns, so cards default to half of it
            grid_options:
              columns: full
            content: |
              {%- set s = 'sensor.amber_engine_decision' -%}
              {%- set rules = state_attr(s, 'rules') or [] -%}
              {%- if not rules -%}
              <ha-alert alert-type="info">No engine run recorded yet. Press <b>Re-evaluate Logic Now</b> to publish the first decision.</ha-alert>
              {%- else -%}
              {%- set icons = {'active': '🟢', 'active_hysteresis': '🟡', 'outranked': '🔵', 'held': '🟠', 'not_met': '⚪',
                               'disabled': '⚫', 'armed': '🟣', 'holding': '🛑', 'pass': '✅'} -%}
              {%- set inp = state_attr(s, 'inputs') or {} -%}
              {%- set tgt = state_attr(s, 'targets') or {} -%}
              {%- set ev = as_datetime(state_attr(s, 'evaluated_at')) -%}
              {%- set age = (now() - ev).total_seconds() | int(0) if ev else 0 -%}
              {%- set win = rules | selectattr('state', 'in', ['active', 'active_hysteresis', 'holding']) | list -%}
              {%- set win = win | last if win else none -%}
              ## {{ state_attr(s, 'status_text') }}

              {% if win -%}
              {{ icons[win.state] }} **{{ win.name }}:** {{ win.summary }}
              {%- else -%}
              ⚪ **Idle:** no rule met its conditions, so the inverter stays in Normal Mode (5).
              {%- endif %}

              <small>Evaluated {{ ev | as_local | as_timestamp | timestamp_custom('%H:%M:%S') if ev else '?' }} ({{ (age // 60) ~ ' min ' if age >= 60 else '' }}{{ age % 60 }} s ago) · trigger: <i>{{ state_attr(s, 'triggered_by') }}</i> · SOC {{ inp.soc }}% · import {{ inp.import_price }}c · feed-in {{ inp.export_price }}c</small>

              {# Health checks -#}
              {%- set ns = namespace(alerts=[]) -%}
              {%- if age > 960 -%}
                {%- set ns.alerts = ns.alerts + ['warning|<b>Stale decision.</b> The engine last ran ' ~ (age // 60) ~ ' min ago; the 15-minute keep-alive should have refreshed it. Check the automation is on and its last trace.'] -%}
              {%- endif -%}
              {%- for e, label in [('sensor.alphaess_soc_battery', 'Battery SOC'), ('sensor.amber_express_home_general_price', 'Import price'), ('sensor.amber_express_home_feed_in_price', 'Feed-in price')] -%}
                {%- set st = states[e] -%}
                {%- if ev and st and st.last_changed > ev and (now() - st.last_changed).total_seconds() > 30 -%}
                  {%- set ns.alerts = ns.alerts + ['warning|<b>' ~ label ~ ' changed after the last run</b> (' ~ st.state ~ ' at ' ~ st.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M:%S') ~ ') and the engine has not re-evaluated. Values below may be out of date.'] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if states('input_text.amber_active_tier_status') != state_attr(s, 'status_text') and states(s) != 'disabled' -%}
                {%- set ns.alerts = ns.alerts + ['error|<b>Status mismatch.</b> The status helper says “' ~ states('input_text.amber_active_tier_status') ~ '” but the engine last decided “' ~ state_attr(s, 'status_text') ~ '”.'] -%}
              {%- endif -%}
              {%- set bad = rules | rejectattr('sync') | map(attribute='name') | list -%}
              {%- if bad -%}
                {%- set ns.alerts = ns.alerts + ['error|<b>Explanation disagrees with the engine</b> for: ' ~ bad | join(', ') ~ '. The rule states below come from the engine and are correct; the condition lists for these rules need updating in the package.'] -%}
              {%- endif -%}
              {%- for a in ns.alerts %}
              <ha-alert alert-type="{{ a.split('|')[0] }}">{{ a.split('|', 1)[1] }}</ha-alert>
              {%- endfor %}

              {#- Inverter helpers vs engine targets -#}
              {%- if states(s) in ['inverter_offline', 'disabled'] %}

              <small>Inverter helpers are not compared while {{ 'the inverter is offline' if states(s) == 'inverter_offline' else 'the master switch is off (manual control)' }}.</small>
              {%- else -%}
              {%- set feed = states('input_number.alphaess_helper_max_feed_to_grid') | float(-1) -%}
              {%- set hw = [
                   ('Dispatch mode', tgt.mode, states('input_select.alphaess_helper_dispatch_mode')),
                   ('Force dispatch', tgt.dispatch, states('input_boolean.alphaess_helper_dispatch')),
                   ('PV switch', tgt.pv, states('input_boolean.alphaess_helper_dispatch_pv_switch')),
                   ('Max feed-to-grid', tgt.feed_to_grid | string, feed | int | string if feed >= 0 else 'unavailable')] %}

              | Inverter helper | Engine wants | Actual | |
              |---|---|---|:-:|
              {% for label, want, have in hw -%}
              | {{ label }} | {{ want }} | {{ have }} | {{ '✅' if want == have else '❌' }} |
              {% endfor -%}
              {%- endif -%}
              {%- endif -%}

          # At-a-glance rule matrix in priority order
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set rules = state_attr('sensor.amber_engine_decision', 'rules') or [] -%}
              {%- set icons = {'active': '🟢', 'active_hysteresis': '🟡', 'outranked': '🔵', 'held': '🟠', 'not_met': '⚪',
                               'disabled': '⚫', 'armed': '🟣', 'holding': '🛑', 'pass': '✅'} -%}
              {%- set labels = {'active': 'Chosen', 'active_hysteresis': 'Chosen (hysteresis)', 'outranked': 'Met, outranked',
                                'held': 'Blocked', 'not_met': 'Not met', 'disabled': 'Off', 'armed': 'Armed',
                                'holding': 'Chosen (stops here)', 'pass': 'Pass'} -%}
              ### 📜 Priority walk-through

              The engine checks these top to bottom and acts on the first rule that is chosen. Rows below the chosen one are still evaluated so you can see what else was met.

              | | # | Rule | Result | Why |
              |:-:|:-:|---|---|---|
              {% for r in rules -%}
              {% set nm = r.name | replace(' ', '&nbsp;') -%}
              | {{ icons[r.state] }} | {{ r.n }} | {{ '**' ~ nm ~ '**' if r.state in ['active', 'active_hysteresis', 'holding'] else nm }} | {{ labels[r.state] | replace(' ', '&nbsp;') }}{{ ' ⚠️' if not r.sync else '' }} | {{ r.summary }} |
              {% endfor %}

              <small>🟢 chosen · 🟡 chosen, held only by exit hysteresis · 🔵 met but a higher rule won · 🟠 entry met but blocked by a hold or guard · ⚪ conditions not met · ⚫ switched off · 🟣 hold armed, nothing to hold · 🛑 gate or hold chosen · ✅ gate passed</small>

          # Per-rule condition breakdown
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set rules = state_attr('sensor.amber_engine_decision', 'rules') or [] -%}
              {%- set icons = {'active': '🟢', 'active_hysteresis': '🟡', 'outranked': '🔵', 'held': '🟠', 'not_met': '⚪',
                               'disabled': '⚫', 'armed': '🟣', 'holding': '🛑', 'pass': '✅'} -%}
              ### 🔍 Why each rule was or wasn't met

              Expand a rule to see every condition the engine checked. A rule that was already active is judged against its **exit** thresholds (entry minus the hysteresis buffer); otherwise its **entry** thresholds apply. ✅ passed · ❌ failed · ➖ not checked in this mode.
              {% for r in rules if r.checks %}
              <details><summary>{{ icons[r.state] }} <b>{{ r.n }}. {{ r.name }}</b> · {{ r.summary }}</summary>

              <i>Judged on {{ r.mode }} thresholds{{ ' (rule was active before this run)' if r.mode == 'exit' else '' }}.</i>{{ ' ⚠️ <b>Explanation disagrees with the engine.</b>' if not r.sync else '' }}

              {% for c in r.checks -%}
              {%- set used = c.x if r.mode == 'exit' else c.e -%}
              - {{ '➖' if used is none else ('✅' if used else '❌') }} {{ c.t }}{{ ' · <i>entry ' ~ ('✅' if c.e else '❌') ~ ', exit ' ~ ('✅' if c.x else '❌') ~ '</i>' if c.e is not none and c.x is not none and c.e != c.x else '' }}
              {% endfor %}
              </details>
              {% endfor %}

      # --- LIVE HELPERS & ENGINE CONTROLS ---
      - type: grid
        cards:
          - type: heading
            heading: Live Helpers & Controls
            icon: mdi:tune
          - type: button
            name: Re-evaluate Logic Now
            icon: mdi:play-circle-outline
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: automation.trigger
              target:
                entity_id: automation.amber_energy_dispatch_optimization_tiered
          - type: button
            name: Reset Inverter (Mode 5)
            icon: mdi:restore
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.alphaess_helper_dispatch_reset_full
              confirmation:
                text: Send a full dispatch reset to the inverter? The engine re-applies its decision on its next run.
          - type: entities
            entities:
              - entity: input_boolean.amber_automation_enabled
                name: Master Automation Switch
              - entity: binary_sensor.alphaess_inverter_connected
                name: Inverter Communication
              - entity: input_text.amber_active_tier_status
                name: Status Helper
                icon: mdi:information-outline
              - entity: sensor.amber_engine_decision
                name: Engine Decision (active_action)
                secondary_info: last-updated
              - type: section
                label: AlphaESS dispatch helpers
              - entity: input_select.alphaess_helper_dispatch_mode
                name: Dispatch Mode
              - entity: input_boolean.alphaess_helper_dispatch
                name: Force Dispatch Active
              - entity: input_number.alphaess_helper_dispatch_duration
                name: Dispatch Duration (min)
              - entity: timer.alphaess_helper_dispatch_timer
                name: Dispatch Timer (keep-alive due at 50 min)
              - entity: input_boolean.alphaess_helper_dispatch_pv_switch
                name: PV Switch (off during negative import)
              - entity: input_number.alphaess_helper_max_feed_to_grid
                name: Max Feed-to-Grid (0 while curtailed)
              - type: section
                label: Automations (last triggered)
              - entity: automation.amber_energy_dispatch_optimization_tiered
                name: Dispatch Engine
                secondary_info: last-triggered
              - entity: automation.amber_solar_soak_daily_cycle_manager
                name: Solar Soak Daily Cycle Manager
                secondary_info: last-triggered
              - entity: automation.amber_house_load_tariff_switch
                name: House Load Tariff Switch
                secondary_info: last-triggered
          - type: entities
            title: Logic tuneables
            entities:
              - entity: input_number.amber_price_hysteresis
                name: Price hysteresis (c/kWh)
              - entity: input_number.amber_soc_hysteresis
                name: SOC hysteresis (%)
              - entity: input_number.amber_export_min_soc_guard
                name: Export SOC guard (%)

      # --- SOLAR SOAK INSPECTOR ---
      - type: grid
        cards:
          - type: heading
            heading: Solar Soak Inspector
            icon: mdi:calculator-variant
          - type: markdown
            content: |
              {%- set t = 'sensor.amber_solar_soak_target_soc' -%}
              {%- set final = states(t) | float(0) -%}
              {%- set at = state_attr(t, 'calculated_at') -%}
              {%- set max_t = state_attr(t, 'max_target_soc') | float(95) -%}
              {%- set min_t = state_attr(t, 'min_soc') | float(20) -%}
              {%- set hr = state_attr(t, 'required_headroom_pct') | float(0) -%}
              {%- macro target(solcast, weight, load, cap, mx, mn) -%}
                {%- set h = (([solcast * weight - load, 0] | max) / cap * 100.0) if cap > 0 else 0 -%}
                {{- ([[mx - h, mn] | max, mx] | min) | round(0) | int -}}
              {%- endmacro -%}
              #### Target SOC: {{ final | int }}%
              {% if at is none -%}
              <ha-alert alert-type="info">The calculation breakdown appears after the next recalculation (00:01, 06:00, 16:05, or when a soak setting changes).</ha-alert>
              {%- else -%}
              <small>Frozen at {{ as_datetime(at) | as_local | as_timestamp | timestamp_custom('%a %H:%M') }}. These are the values the engine is using.</small>

              | Step | Value |
              |---|---|
              | Solcast P10 yield | {{ state_attr(t, 'solcast_kwh') }} kWh |
              | × forecast weight | {{ state_attr(t, 'weight') }} → {{ (state_attr(t, 'solcast_kwh') | float(0) * state_attr(t, 'weight') | float(1)) | round(2) }} kWh |
              | − avg daytime load | {{ state_attr(t, 'house_load_kwh') }} kWh |
              | = solar to battery | {{ state_attr(t, 'expected_solar_to_batt_kwh') }} kWh |
              | ÷ capacity | {{ state_attr(t, 'battery_capacity_kwh') }} kWh → **{{ hr }}% headroom** |
              | Max target − headroom | {{ max_t | int }}% − {{ hr }}% = {{ (max_t - hr) | round(1) }}% |
              | Clamped to {{ min_t | int }}–{{ max_t | int }}% | **{{ final | int }}%** |

              {%- set live = target(states('sensor.amber_solcast_10_forecast') | float(0), states('input_number.amber_soak_forecast_weight') | float(1),
                                    states('sensor.amber_average_daytime_house_load') | float(0), states('input_number.amber_battery_capacity') | float(10),
                                    states('input_number.amber_soak_max_target_soc') | float(95), states('input_number.amber_soak_min_soc') | float(20)) | int -%}
              {%- if live != final | int %}

              <ha-alert alert-type="info">With today's live forecast and load the target would be <b>{{ live }}%</b>. The engine keeps using {{ final | int }}% until the next scheduled recalculation.</ha-alert>
              {%- endif -%}
              {%- endif %}

              #### Pre-discharge status
              {%- set rules = state_attr('sensor.amber_engine_decision', 'rules') or [] -%}
              {%- set soak = rules | selectattr('key', 'eq', 'solar_soak') | list -%}
              {%- set soc = states('sensor.alphaess_soc_battery') | float(0) -%}
              {%- set cap = states('input_number.amber_battery_capacity') | float(0) %}

              - **Battery SOC:** {{ soc }}% → target {{ final | int }}% ({{ [soc - final, 0] | max | round(1) }}% / {{ ([soc - final, 0] | max / 100 * cap) | round(2) }} kWh left to pre-export)
              - **Pre-export window sensor:** {{ states('sensor.amber_negative_export_forecast_12h') }}{{ ' (latched while soaking)' if 'Solar Soak' in states('input_text.amber_active_tier_status') else '' }}
              - **Completed today:** {{ 'yes' if is_state('input_boolean.amber_solar_soak_completed_today', 'on') else 'no' }}
              {%- if soak %}
              - **Engine verdict:** {{ soak[0].summary }}
              {%- endif %}

      # --- TELEMETRY ---
      - type: grid
        cards:
          - type: heading
            heading: Live Telemetry & Forecasts
            icon: mdi:access-point-network
          - type: entities
            entities:
              - type: section
                label: Prices & forecasts
              - entity: sensor.amber_express_home_feed_in_price
                name: Live Feed-in Price ($/kWh)
              - entity: sensor.amber_express_home_general_price
                name: Live General Price ($/kWh)
              - entity: sensor.amber_max_export_forecast_12h
                name: Next 12h Max Export Forecast (c/kWh)
              - entity: sensor.amber_min_import_forecast_12h
                name: Next 12h Min Import Forecast (c/kWh)
              - entity: sensor.amber_negative_export_forecast_12h
                name: Solar Soak Pre-Export Window
              - type: section
                label: Solar forecast & soak headroom
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Solcast Today (used before 16:00)
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Solcast Tomorrow (used from 16:00)
              - entity: sensor.amber_solcast_10_forecast
                name: Extracted Solcast P10 Yield (kWh)
              - entity: sensor.amber_average_daytime_house_load
                name: 7-Day Daytime House Load Avg (kWh)
              - entity: sensor.amber_solar_soak_target_soc
                name: Soak Target SOC (%)
                secondary_info: last-changed
              - entity: input_boolean.amber_solar_soak_completed_today
                name: Solar Soak Completed Today
              - type: section
                label: Battery & power flows
              - entity: binary_sensor.alphaess_inverter_connected
                name: Inverter Communication
              - entity: sensor.alphaess_soc_battery
                name: Battery SOC (%)
              - entity: sensor.alphaess_battery_full
                name: Battery Full Flag
              - entity: sensor.alphaess_power_battery
                name: Battery Power (W)
              - entity: sensor.alphaess_current_pv_production
                name: Solar PV Generation (W)
              - entity: sensor.alphaess_power_grid
                name: Grid Power (W)

      # --- ACTIVITY LOG ---
      - type: grid
        cards:
          - type: heading
            heading: Activity (last 24 h)
            icon: mdi:history
          - type: logbook
            hours_to_show: 24
            entities:
              - sensor.amber_engine_decision
              - input_text.amber_active_tier_status
              - automation.amber_energy_dispatch_optimization_tiered
              - automation.amber_solar_soak_daily_cycle_manager
              - input_boolean.alphaess_helper_dispatch
              - input_select.alphaess_helper_dispatch_mode
              - input_boolean.amber_solar_soak_completed_today
              - input_boolean.amber_automation_enabled

  # =========================================================================
  # VIEW 2: SCENARIO SIMULATOR & TESTING RECIPES
  # =========================================================================
  - title: Scenario Simulator
    path: simulator
    icon: mdi:flask-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Testing Recipes
            icon: mdi:flask-outline
          - type: button
            name: Re-evaluate Automation Now
            icon: mdi:play-circle-outline
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: automation.trigger
              target:
                entity_id: automation.amber_energy_dispatch_optimization_tiered
          - type: button
            name: Reset Inverter to Normal (Mode 5)
            icon: mdi:restore
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.alphaess_helper_dispatch_reset_full
              confirmation:
                text: Send a full dispatch reset to the inverter?
          - type: markdown
            content: |
              Temporarily adjust thresholds on the main dashboard's **Rules** and **Tuning** views to force a scenario, press **Re-evaluate**, then check the result on the **Engine Diagnostics** view. Put the thresholds back afterwards.

              ---

              #### ☀️ 1. Solar Soak pre-export
              1. **Rules → Solar Soak & Curtailment:** set **Curtail at or below** to `-100c` and **Pre-export at or above** to `0c`.
              2. **Tuning → Solar Soak:** set **Forecast weight** to `2.00` (pushes the target SOC down) and make sure **Minimum SOC floor** is below the current SOC.
              3. Check `sensor.amber_negative_export_forecast_12h` is `on` and **Solar Soak Completed Today** is `off`.
              4. Press **Re-evaluate**.

              **Expect:** `☀️ Solar Soak Pre-Export Active`, Mode 4. Walk-through row 6 is 🟢.

              #### 🛑 2. Curtailment
              1. **Rules → Solar Soak & Curtailment:** set **Curtail at or below** to `150c` (above the live feed-in).
              2. Make sure curtailment is on and `sensor.alphaess_battery_full` is `true`.
              3. Press **Re-evaluate**.

              **Expect:** `🛑 Solar Curtailed`, Mode 5, max feed-to-grid 0. After the battery-full flag drops, row 4 turns 🟡 (held by hysteresis).

              #### 📤 3. Export Tier 1
              1. **Rules → Export Tiers:** set Tier 1 **Min feed-in price** to `0c` and **Min SOC** to `0%`.
              2. Make sure curtailment and the export hold are not blocking (rows 4–5 not 🟢/🛑).
              3. Press **Re-evaluate**.

              **Expect:** `📤 Exporting (Tier 1)`, Mode 4.

              #### 📥 4. Import Tier 1
              1. **Rules → Import Tiers:** set Tier 1 **Max import price** to `500c` and **Max SOC** to `100%` (SOC must be below 98%).
              2. Make sure the import hold is off or not armed.
              3. Press **Re-evaluate**.

              **Expect:** `📥 Importing (Tier 1)`, Mode 6.

              #### 🔮 5. Predictive export hold
              1. **Rules → Predictive Holds:** turn the export hold on, set **Hold if 12h max is at or above** to `0c` and **Release if live is above** to `2000c`.
              2. Make sure an export tier or Solar Soak meets entry (🔵 or 🟢 in the walk-through).
              3. Press **Re-evaluate**.

              **Expect:** `🛑 Holding Exports (Spike Forecasted!)`. The held rules show 🟠.

              #### 🛡️ 6. Export SOC guard
              1. Enable an export tier with a `0c` price and a min SOC below the current SOC.
              2. **Tuning → Safeguards:** set **Export SOC guard** to `50%` (above the current SOC).
              3. Press **Re-evaluate**.

              **Expect:** `🛑 Export Blocked (SOC Guard Active)`. Row 7 is 🛑.

      # --- DIRECT MODBUS HARDWARE OVERRIDE ---
      - type: grid
        cards:
          - type: heading
            heading: Direct Modbus Overrides
            icon: mdi:alert-octagon-outline
          - type: markdown
            content: |
              <ha-alert alert-type="warning">These write straight to the inverter helpers. While the master switch is on, the engine overwrites them on its next run.</ha-alert>
          - type: entities
            entities:
              - entity: input_select.alphaess_helper_dispatch_mode
                name: Dispatch Mode
              - entity: input_number.alphaess_helper_dispatch_duration
                name: Dispatch Duration (min)
              - entity: input_boolean.alphaess_helper_dispatch
                name: Send Dispatch Command
              - entity: input_button.alphaess_helper_dispatch_reset_full
                name: Force Reset to Normal (Mode 5)
              - entity: input_boolean.alphaess_helper_dispatch_pv_switch
                name: PV Switch
              - entity: input_number.alphaess_helper_max_feed_to_grid
                name: Max Feed-to-Grid (%)
